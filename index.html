<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Viewer</title>

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#1e1e1e;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  display:flex;
  gap:8px;
  padding:10px;
  background:#2a2a2a;
  border-bottom:1px solid #444;
}

button {
  padding:8px 12px;
  border:none;
  background:#444;
  color:white;
  cursor:pointer;
  border-radius:8px;
}

button:hover {
  background:#666;
}

input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
}

#viewer {
  flex:1;
  overflow:auto;
  background:white;
  color:black;
  padding:30px;
}

.loading {
  color:#aaa;
}

img {
  max-width:100%;
}
</html>
